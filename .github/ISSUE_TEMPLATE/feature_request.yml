name: Feature request
description: Suggest a capability for the dashboard
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where DeskDot gets in your way or falls short.
      placeholder: I keep DeskDot open next to my editor, but the notes card only shows the latest note.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should DeskDot do instead? Sketches or mock-ups welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: A separate window instead, or a compact mode for the whole page.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Window behaviour
        - Focus timer
        - Weather
        - Clipboard
        - Notes
        - Screen time
        - Agenda / up next
        - System stats
        - Setup, modules and hotkeys
        - Packaging / installer
        - Other
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps DeskDot dependency-free (no new NuGet packages)
          required: false
        - label: I checked docs/ROADMAP.md and this is not already planned
          required: true
