name: Bug report
description: Something in the island is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — Windows build and
        display setup are usually what decide the diagnosis.

  - type: input
    id: version
    attributes:
      label: DeskDot version
      description: Shown in the installer name, or the tag you built from.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: Run `winver` and paste the line that starts with "Version".
      placeholder: "Windows 11 Pro, Version 24H2 (OS Build 26100.2314)"
    validations:
      required: true

  - type: input
    id: displays
    attributes:
      label: Display setup
      description: Number of monitors, resolution and scaling.
      placeholder: "2 monitors, 2560x1440 @ 125%, 1920x1080 @ 100%"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Alt+Space
        2. Click Focus → Start
        3. Lock the PC and sign back in
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Crash log (if any)
      description: Paste the tail of `%APPDATA%\DeskDot\crash.log`.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am on the latest release
          required: false
